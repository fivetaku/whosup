id = "fivetaku.whosup"
name = "whosup"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Stop abandoning your agent sessions. One board for every agent session in herdr: what needs input, what finished, what's running. Click to jump to that session."
# windows: herdr runs commands without a shell, so Windows uses the node entries below (scripts/launch.mjs).
# Each item says where it runs; the sh items are for linux and macos exactly as before.
platforms = ["linux", "macos", "windows"]

# Node 22.13+ only (node:sqlite). Nothing is compiled: the build hook checks Node, then runs first-run setup in the terminal
# you install from (scripts/setup.mjs --install). It looks at this machine (terminal app, Herdr app, ovis, agents), asks only
# what has more than one answer, saves your picks to setup.json in the plugin config dir, and, if herdr is running,
# starts the board once the install command returns (the start action below). With no terminal (agents, CI) it asks nothing;
# the board asks on first open. Ctrl-C at a question ends the install command too: nothing is installed or saved.
# auto.json is not written here (herdr gives no state folder at build time); startup writes it.
[[build]]
command = ["sh", "scripts/preflight.sh", "install"]
platforms = ["linux", "macos"]

# Brings the board up when herdr starts (and opens the browser once, unless OPEN_BROWSER=0 or the session is remote).
# The start action runs the same command; the install invokes it once, right after the install command returns.
[[startup]]
command = ["sh", "scripts/plugin.sh", "start"]
platforms = ["linux", "macos"]

[[actions]]
id = "start"
title = "Start whosup"
contexts = ["workspace"]
command = ["sh", "scripts/plugin.sh", "start"]
platforms = ["linux", "macos"]

[[actions]]
id = "stop"
title = "Stop whosup"
contexts = ["workspace"]
command = ["sh", "scripts/plugin.sh", "stop"]
platforms = ["linux", "macos"]

[[actions]]
id = "status"
title = "whosup status"
contexts = ["workspace"]
command = ["sh", "scripts/plugin.sh", "status"]
platforms = ["linux", "macos"]

[[actions]]
id = "desks-apply"
title = "Create desks from desks.json"
contexts = ["workspace"]
command = ["sh", "-c", ". scripts/node-path.sh && exec node scripts/desks.mjs apply"]
platforms = ["linux", "macos"]

[[actions]]
id = "desks-status"
title = "Desks status"
contexts = ["workspace"]
command = ["sh", "-c", ". scripts/node-path.sh && exec node scripts/desks.mjs status"]
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open whosup in browser"
contexts = ["workspace"]
command = ["sh", "scripts/plugin.sh", "open"]
platforms = ["linux", "macos"]

[[actions]]
id = "autoconf"
title = "whosup autoconf (check this machine, update auto-detected settings)"
contexts = ["workspace"]
command = ["sh", "-c", ". scripts/node-path.sh && exec node scripts/autoconf.mjs"]
platforms = ["linux", "macos"]

# ── Windows (no sh): the same jobs through node. Action ids must be unique in a plugin, so these carry a win- prefix.
# The Windows build step asks nothing (herdr runs it without a visible console) and detects nothing; the board asks on first open.
[[build]]
command = ["node", "scripts/launch.mjs", "install"]
platforms = ["windows"]

[[startup]]
command = ["node", "scripts/launch.mjs", "start"]
platforms = ["windows"]

[[actions]]
id = "win-start"
title = "Start whosup"
contexts = ["workspace"]
command = ["node", "scripts/launch.mjs", "start"]
platforms = ["windows"]

[[actions]]
id = "win-stop"
title = "Stop whosup"
contexts = ["workspace"]
command = ["node", "scripts/launch.mjs", "stop"]
platforms = ["windows"]

[[actions]]
id = "win-status"
title = "whosup status"
contexts = ["workspace"]
command = ["node", "scripts/launch.mjs", "status"]
platforms = ["windows"]

[[actions]]
id = "win-desks-apply"
title = "Create desks from desks.json"
contexts = ["workspace"]
command = ["node", "scripts/desks.mjs", "apply"]
platforms = ["windows"]

[[actions]]
id = "win-desks-status"
title = "Desks status"
contexts = ["workspace"]
command = ["node", "scripts/desks.mjs", "status"]
platforms = ["windows"]

[[actions]]
id = "win-open"
title = "Open whosup in browser"
contexts = ["workspace"]
command = ["node", "scripts/launch.mjs", "open"]
platforms = ["windows"]

[[actions]]
id = "win-doctor"
title = "whosup doctor (read-only check)"
contexts = ["workspace"]
command = ["node", "scripts/doctor.mjs"]
platforms = ["windows"]

[[actions]]
id = "win-autoconf"
title = "whosup autoconf (check this machine, update auto-detected settings)"
contexts = ["workspace"]
command = ["node", "scripts/autoconf.mjs"]
platforms = ["windows"]
