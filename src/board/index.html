@media (max-width:480px){header{gap:6px;padding:0 8px}.tools{gap:2px}.ib{width:28px;height:28px}.ib svg{width:15px;height:15px}.nb{font-size:0;padding:6px 10px;letter-spacing:0}.nb::before{content:'+';font-size:16px;line-height:1}}
/* 낮은 창(높이 640px 이하): 상단 띠를 한 줄 숫자로 줄여 세션에 자리를 내준다 */
@media (max-height:640px) and (min-width:761px){.hero{grid-template-columns:1fr;padding-top:12px}.hero .r{display:none}.stats{grid-template-columns:repeat(6,1fr)}.stat{padding:0 8px 8px 0;margin-right:8px}.stat .n{font-size:28px;margin-top:2px}.stat .sub{display:none}.nextline{padding:8px 0 9px}}
/* 서버가 답하지 않으면 판을 흐리게 — 옛 숫자가 지금 상태처럼 보이지 않게 */
body.offline main{opacity:.4}#stamp{max-width:46vw;overflow:hidden;text-overflow:ellipsis}
/* 폭에 따라 다른 세션 상자: 좁은 띠(화면 나눠 쓰기) = 한 줄 목록, 넓은 띠(27"·울트라와이드) = 세션 더 많이 + 요약 2줄 + 큰 시간 */
@container strip (max-width:639px){.deskrow{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.cell,.cell.next,.cell:has(.resume),.cell:has(.stale){min-height:0;padding:10px 12px 10px}.cell .top{gap:8px;letter-spacing:.06em}.cell .top .st::before,.cell.done .top .st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:middle}.cell.snooze .top .st::before{background:none}.cell .t{font-size:15px;font-weight:500;letter-spacing:0}.cell.wait .t{font-weight:700}.cell .sum{-webkit-line-clamp:1;margin-top:6px;font-size:14px}.cell .top{grid-column:1/-1}.cell .resume,.cell .stale,.cell.next::after{position:static;grid-column:1/-1;justify-self:end;margin-top:6px}.cell.wait .sum,.cell.fail .sum,.cell.done .sum{-webkit-line-clamp:2}}
@container strip (min-width:2200px){.deskrow{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}.cell{min-height:clamp(150px,15vh,200px);padding:20px 22px 50px}.cell .sum{-webkit-line-clamp:2;font-size:16px}.cell .t{font-size:30px}}
/* 높이 맞춤: 세션이 화면 아래로 넘치면 ① 히어로를 줄이고(fit1) ② 그래도 넘치면 남은 높이를 세션 줄 수로 나눠 세션 상자 높이를 맞춘다(--fit-h). 요약 글은 숨기지 않는다. render()마다 다시 잰다. */
html.fit1 .stat .n{font-size:clamp(30px,4.2vh,46px);margin-top:6px}html.fit1 .stat .sub{margin-top:5px;font-size:12px}html.fit1 .stat{padding-bottom:12px}html.fit1 .hero .caps{font-size:10px}html.fit1 .spark{height:26px;margin-top:8px}html.fit1 .r .lab{padding-bottom:8px}html.fit1 .nextline{padding:10px 0 11px}html.fit1 .nextline .lb,html.fit1 .nextline .qq{font-size:15px}html.fit1 .nextline .w{font-size:19px}
html.fit2 .cell,html.fit2 .cell.next,html.fit2 .cell:has(.resume),html.fit2 .cell:has(.stale){min-height:var(--fit-h);height:var(--fit-h);overflow:hidden;padding:14px 16px 12px}html.fit2 .cell .sum{margin-top:8px}html.fit2.tight .cell .sum{-webkit-line-clamp:2;font-size:14px}

.cell.wait{background:#e4e4e4}.cell.done{background:#f2f2f2}:root[data-theme="dark"] .cell.wait{background:#3a3a3a}:root[data-theme="dark"] .cell.done{background:#2c2c2c}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cell.wait{background:#3a3a3a}:root:not([data-theme="light"]) .cell.done{background:#2c2c2c}}.cell.wait:hover,.cell.done:hover{filter:brightness(.97)}

.cell .acts{position:absolute;left:14px;bottom:14px;display:none;gap:4px;z-index:2}.cell:hover .acts,.cell:focus-within .acts{display:flex}
.cell .acts button{font-size:12px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line2);background:var(--bg);color:var(--ink2);padding:3px 7px}.cell .acts button:hover{border-color:var(--ink);color:var(--ink)}
.cell.fail .acts button{background:transparent;border-color:#fff}
/* 단추가 글자를 가리지 않게(F15). 보통 띠: 단추는 아래 50px 띠 안에만 뜬다. 오른쪽 아래 단추(이어서 열기·에이전트 시작)가 있는 상자에서는 그 자리를 남기고, 모자라면 위로 접힌다.
   높이 맞춤(fit2): 띠를 비워 둘 높이가 없어 마우스를 올린 상자의 요약을 한 줄로 줄이고 그 아래에 띄운다.

.cell .pinmark{color:var(--ink);margin-right:4px}.cell .tag{font-size:12px;letter-spacing:.04em;border:1px solid var(--line2);padding:1px 5px;margin-left:6px;color:var(--muted)}

.cell.snooze .top .st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;border:1px solid var(--accent-soft);margin-right:6px;vertical-align:middle}
.cell.dim{opacity:.22}.cell.dim:hover{opacity:.6}

// 경과 시간: [값, 단위]
function ago(iso, now) {
  if (!iso) return null
  const m = Math.max(0, Math.floor((now - new Date(iso)) / 60000))
  return m >= 1440 ? [Math.floor(m / 1440), T.day] : m >= 60 ? [Math.floor(m / 60), T.hour] : [m, T.min]
}
const tnum = (iso, now) => { const a = ago(iso, now); return a ? `${a[0]}<small>${a[1]}</small>` : '<small>—</small>' }

// 세션판의 세션 → 띠 세션 상태
function stateOf(c, b) {
  if (b.columns.red.some((x) => x.id === c.id)) return c.failed ? 'fail' : 'wait'
  if (b.columns.yellow.some((x) => x.id === c.id)) return 'done'
  if ((b.columns.snoozed || []).some((x) => x.id === c.id)) return 'snooze'
  if (c.status === 'shell') return 'shell'
  if (c.status === 'working') return 'run'
  return 'idle'
}
const sinceOf = (c, st) => (st === 'wait' || st === 'fail' || st === 'done' || st === 'snooze') ? c.attention_since : (c.last_prompt_at || c.last_user_msg_at || c.attention_since)
const labelOf = (c) => c.label || c.project
// 긴 이름 줄이기: 이름·명령은 끝을 '…'로, 경로는 앞(~ 또는 첫 마디)과 끝 폴더를 남기고 가운데를 '…'로. 전체는 title로 보여 준다.
const clip = (s, n) => { const a = [...String(s ?? '')]; return a.length > n ? a.slice(0, n - 1).join('') + '…' : a.join('') }
const clipPath = (p, n = 40) => {
  p = String(p ?? ''); if ([...p].length <= n) return p
  const sep = p.includes('\\') && !p.includes('/') ? '\\' : '/', segs = p.split(sep).filter((x, i) => x || i === 0)
  let tail = segs.pop() || ''
  if ([...tail].length > n - 4) return '…' + sep + clip(tail, n - 2)
  while (segs.length > 1 && [...(segs[segs.length - 1] + sep + tail)].length <= n - 6) tail = segs.pop() + sep + tail
  return (segs[0] || '') + sep + '…' + sep + tail
}
const titleOf = (c) => (c.title === `${c.project} · ${c.provider}` ? c.project : c.title)
const nextSummary = (c, st) => { const s = summaryOf(c, st); return s === labelOf(c) || s === c.project ? (st === 'fail' ? T.failNoSay : st === 'done' ? T.done : c.ask_kind === 'approval' ? T.waiting : T.needsInput) : s }
const locQ = (q) => q && q.replace(/ — 승인할까요\?$/, ` — ${T.approveQ}`).replace(/^승인할까요\?$/, T.approveQ).replace(/^이 폴더를 신뢰할까요\? \(Yes, I trust this folder\)$/, T.trustQ)

function allCards(b) {
  const seen = new Set()
  const out = []
  for (const k of ['red', 'yellow', 'snoozed', 'green', 'carry', 'grey']) for (const c of b.columns[k]) {
    // 서버를 끈 herdr 데스크·꺼 둔 Herdr 앱 데스크(off)의 세션은 판에 올리지 않는다. 기록은 DB에 남아 데스크를 다시 켜면 그대로 돌아온다.
    if (c.kind === 'lane' || seen.has(c.id) || !c.caps || c.off) continue
    seen.add(c.id); out.push(c)
  }
  return out.sort((a, b2) => a.ref.localeCompare(b2.ref, 'en', { numeric: true }))
}

// 데스크 끄기는 누르는 즉시 화면에 반영한다(낙관 표시). herdr 서버가 실제로 내려가는 데 3초 넘게 걸릴 수 있어서다
// (실측: 에이전트 5개 데스크 3.17초). 서버가 꺼졌다고 알려 주거나 15초가 지나면 낙관 표시를 거둔다. 실패하면 바로 되돌린다.
const pendingOff = new Map()
function applyPendingOff(b) {
  const now = Date.now()
  for (const [desk, at] of pendingOff) if (now - at > 15000) pendingOff.delete(desk)
  if (!pendingOff.size) return b
  for (const k of ['red', 'yellow', 'snoozed', 'green', 'carry', 'grey']) for (const c of b.columns[k] || []) if (pendingOff.has(c.desk)) c.off = true
  return b
}
// 세션이 있던 데스크 중 서버가 꺼진 것(원래 안 쓰는 default처럼 세션이 없던 데스크는 빼고)
// 데스크 켜기 요청 본문: 설정(desk_resume)이 ask면 이번 한 번 물어 정한다(확인 = 이어서 열기, 취소 = 새로 시작).
// on·off면 묻지 않고 서버가 설정대로 한다.
function deskStartBody(desk, mode, ask) {
  return mode === 'ask' ? { session: desk, on: true, resume: Boolean(ask()) } : { session: desk, on: true }
}
function offDesksOf(b) {
  const d = new Map()   // 데스크 열쇠 → 보일 이름
  for (const k of ['red', 'yellow', 'snoozed', 'green', 'carry', 'grey']) for (const c of b.columns[k] || []) if (c.off && c.caps?.includes('toggle')) d.set(c.desk, c.desk_label || c.desk)
  return [...d]
}

function sparkline(hourly) {
  if (!hourly || hourly.length < 2) return '<svg viewBox="0 0 400 54" preserveAspectRatio="none"></svg>'
  const max = Math.max(1, ...hourly)
  const pts = hourly.map((v, i) => `${(i / (hourly.length - 1)) * 400},${50 - (v / max) * 44}`).join(' ')
  return `<svg viewBox="0 0 400 54" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${pts}"/></svg>`
}

  // 상단 띠: 전체 현황(상태별 큰 숫자) + 오늘 추이 + 다음 1건 한 줄
  const nx = b.next && b.next.caps ? b.next : null

  const hero = document.getElementById('hero')

      return `<div role="button" tabindex="0" class="cell ${st}${nx && c.id === nx.id ? ' next' : ''}${matches(st) ? '' : ' dim'}" data-next="${T.next}" data-open="${c.id}" title="${esc(c.title)} · ${esc(c.ref)}${c.branch ? ' · ' + esc(c.branch) : ''}${c.cwd ? ' · ' + esc(c.cwd) : ''}${!ro && tabOnly(c) && clickPlan(c).url ? ' · ' + esc(T.tabOnlyTip) : ''}">${acts(c, st)}

        <div class="sum">${summaryOf(c, st) === labelOf(c) || summaryOf(c, st) === c.project ? `<span class="path">${esc(c.cwd ? clipPath(c.cwd.replace(/^\/Users\/[^/]+/, '~'), 40) : T.noPrompt)}</span>` : esc(summaryOf(c, st))}</div>
        ${st === 'shell' && !ro && c.caps.includes('resume') ? `<button class="resume" data-resume="${c.id}" data-sid="${esc(c.resume?.sid || '')}" title="${esc(c.resume ? T.resumeWhat(c.resume.prompt, (ago(c.resume.at, now) || []).join('')) : T.resumeFresh)}">${T[resumeLabelKey(c, false)]}</button>` : c.stale && !(nx && c.id === nx.id) ? `<span class="stale">${T.stale}</span>` : ''}</div>`
  }
  const closedHtml = (closed.length ? `<details class="closedrow"${closedOpen ? ' open' : ''}><summary class="caps"><em>${T.closedTitle}</em><span>${closed.length}</span><span>${T.closedHint(keep)}</span></summary><div class="closed">${closed.map((c) => `<div class="c"><span class="lb" title="${esc(c.pane_label || c.project)}">${esc(clip(c.pane_label || c.project, 28))}</span><span class="why">${esc(c.desk_label || c.desk)} · ${c.reason === 'stashed' ? T.stashedWhy : T.gone} · ${(ago(c.closed_at, now) || ['', ''])[0]}${(ago(c.closed_at, now) || ['', ''])[1]}</span>${ro ? '' : c.reason === 'stashed' ? `<button data-act="unstash" data-id="${c.id}">${T.unstashBtn}</button>` : c.caps && !c.caps.includes('resume') ? '' : `<button data-resume="${c.id}" data-sid="${esc(c.resume?.sid || '')}" title="${esc(c.resume ? T.resumeWhat(c.resume.prompt, (ago(c.resume.at, now) || []).join('')) : T.resumeFresh)}">${T[resumeLabelKey(c, true)]}</button>`}</div>`).join('')}</div></details>` : '')
  // 포커스가 있던 세션(또는 그 안의 버튼)을 기억했다가, 그 세션 상자를 갈아 끼웠으면 돌려준다.
  const ae = document.activeElement, fcell = ae?.closest?.('.cell[data-open]')
  const fkey = fcell ? { id: fcell.dataset.open, sub: ae === fcell ? null : ae.dataset.act ? `[data-act="${ae.dataset.act}"]` : ae.dataset.resume ? '[data-resume]' : ae.dataset.closepane ? '[data-closepane]' : null } : null
  const cellsNow = new Map(groups.flatMap((g) => g.cards.map((c) => [String(c.id), cellHtml(c)])))
  const heads = groups.map(headHtml)
  const skeleton = JSON.stringify(groups.map((g) => [g.desk, g.label, Boolean(g.pinned), g.cards.map((c) => c.id)]))
  if (skeleton === drawn.skeleton && strip.querySelector('#closedwrap')) {
    // 세션 배치가 그대로면 글자가 바뀐 세션·머리줄만 갈아 끼운다.
    strip.querySelectorAll('.desk').forEach((el, i) => { if (heads[i] !== drawn.heads[i]) el.outerHTML = heads[i] })
    for (const [id, html] of cellsNow) if (drawn.cells.get(id) !== html) { const el = strip.querySelector(`.cell[data-open="${id}"]`); if (el) el.outerHTML = html }
    if (closedHtml !== drawn.closed) strip.querySelector('#closedwrap').innerHTML = closedHtml
  } else {
    strip.innerHTML = groups.map((g, i) => `${heads[i]}<div class="deskrow" style="--n:${Math.max(g.cards.length, 3)}">${g.cards.map((c) => cellsNow.get(String(c.id))).join('')}</div>`).join('') + `<div id="closedwrap">${closedHtml}</div>`
  }
  Object.assign(drawn, { skeleton, heads, cells: cellsNow, closed: closedHtml })
  if (fkey && !document.activeElement?.closest?.('.cell[data-open]')) {
    const el = strip.querySelector(`.cell[data-open="${fkey.id}"]`)
    ;((fkey.sub && el?.querySelector(fkey.sub)) || el)?.focus({ preventScroll: true })
  }
  fitHeight()
  flipPlay(before)
  signal(cards, states)
}

// 세션이 보드 아래로 넘쳐 스크롤이 생기면 히어로를 줄이고, 그래도 넘치면 세션 상자 높이를 남은 높이에 맞춘다. 좁은 화면(760px 이하)은 목록형이라 건드리지 않는다.
function fitHeight() {
  const root = document.documentElement, strip = document.getElementById('strip')
  root.classList.remove('fit1', 'fit2', 'tight'); root.style.removeProperty('--fit-h')
  if (innerWidth <= 760 || strip.scrollHeight <= strip.clientHeight + 1) return
  root.classList.add('fit1')
  if (strip.scrollHeight <= strip.clientHeight + 1) return
  const cells = [...strip.querySelectorAll('.cell')]
  if (!cells.length) return
  const rows = new Set(cells.map((c) => c.offsetTop)).size
  const cellsH = [...new Set(cells.map((c) => c.offsetTop))].reduce((sum, top) => sum + Math.max(...cells.filter((c) => c.offsetTop === top).map((c) => c.offsetHeight)), 0)
  const other = strip.scrollHeight - cellsH
  const h = Math.floor((strip.clientHeight - other) / rows) - 1
  // 세션 상자가 글자를 담지 못할 만큼 낮아지면(96px 미만) 누르지 않고 스크롤하게 둔다 — 눌린 세션 상자는 요약과 버튼이 겹쳤다.
  if (h < 96) return
  root.style.setProperty('--fit-h', Math.max(h, 76) + 'px')
  root.classList.add('fit2')
  if (h < 112) root.classList.add('tight')
}

// 코어 프로필의 주소, 세션 ref의 '/' 앞이 코어 이름)를 쓴다. 코어마다 주소가 다르므로 다른 코어의 주소로 넘어가지 않는다.

  const i = c.ref.indexOf('/'), pane = c.ref.slice(i + 1)

// 클릭 순번: 서버가 도착 순서가 아니라 클릭 순서로 마지막 클릭을 고르게 한다(터널·네트워크에서 순서가 바뀜)
let clickN = 0
/*webtab*/
// 데스크마다 탭 하나(이름 붙인 탭). 누를 때마다 그 탭을 그 주소로 다시 보낸다 — 탭 안에서 다른 세션으로 옮겨 가 있을 수 있어서,
// 마지막으로 보낸 주소가 같다고 건너뛰지 않는다.
// 탭은 이 보드와 연결된 채로(opener) 연다. 연결을 끊으면 브라우저가 그 탭을 다시 보내지 못하게 막는다(다른 출처로 넘어간
// 탭은 연 쪽만 옮길 수 있다 — 실제 브라우저에서 확인). 그래서 주소에는 자신이 믿는 웹 터미널만 적는다(README).
// 돌려주는 값 { ok, win, fresh }: ok=false면 브라우저가 탭을 막았다. fresh=이번 클릭이 새로 연 탭.
const openedTabs = new Map()
function openTab(desk, url) {
  try {
    const prev = openedTabs.get(desk)
    const fresh = !prev || prev.closed
    const win = window.open(url, `whosup-${desk}`)
    if (!win) return { ok: false }
    try { win.focus() } catch {}
    openedTabs.set(desk, win)
    return { ok: true, win, fresh }
  } catch { return { ok: false } }
}
// 주소를 아직 모르는 탭을 누르는 순간에 잡아 둔다(위 latertab 덩어리의 설명). 그 데스크의 탭이 이미 있으면 그 탭을 그대로 쓰고(건드리지 않는다),
// 없으면 빈 탭을 연다 — 주소 없이 열면 같은 이름의 탭이 남아 있을 때 그 탭을 다른 데로 보내지 않고 돌려받는다.
// 돌려주는 값 { ok, win, fresh }: ok=false면 브라우저가 탭을 막았다. fresh=이번에 새로 연 빈 탭(요청이 실패하면 닫는다).
function holdTab(desk, note) {
  try {
    const prev = openedTabs.get(desk)
    if (prev && !prev.closed) return { ok: true, win: prev, fresh: false }
    const win = window.open('', `whosup-${desk}`)
    if (!win) return { ok: false }
    let fresh = false
    try { fresh = win.location.href === 'about:blank' } catch {}   // 읽을 수 없으면 다른 출처로 가 있는 탭이다: 전부터 있던 탭
    if (fresh && note) { try { win.document.title = note; win.document.body.textContent = note } catch {} }
    openedTabs.set(desk, win)
    return { ok: true, win, fresh }
  } catch { return { ok: false } }
}
/*/webtab*/
// 새 세션이 생기는 요청(새 세션·이어서 열기·에이전트 시작)을 보낸다. probe = 그 세션을 대신할 카드(deskProbe 또는 그 카드 자체, 없으면 null).
// 탭으로만 보여 줄 수 있는 세션이면 앱 창을 올리지 않게 보내고(raise:false), 누르는 순간 잡아 둔 탭을 서버가 알려 준 주소로 보낸다.
// 아니면 예전 그대로 보낸다. 반드시 클릭·키 처리 안에서 await 없이 불러야 한다(탭을 잡는 일이 첫 await 앞에 있다).
async function postWithTab(path, body, probe, note) {
  const plan = laterTabPlan(probe, lsGet)
  const tab = plan.tab ? holdTab(probe.desk, note) : null
  const { ok, data } = await post(path, plan.tab ? { ...body, raise: plan.raise } : body)
  const end = laterTabEnd({ want: plan.tab, held: Boolean(tab?.ok), fresh: Boolean(tab?.fresh), ok: ok && data?.ok !== false, url: plan.tab && ok ? laterTabUrl(data?.url, openUrlTemplateFor(probe, lsGet)) : '' })
  if (end.act === 'go') { try { tab.win.location.replace(end.url); tab.win.focus() } catch {} }
  if (end.act === 'close') { try { tab.win.close() } catch {} openedTabs.delete(probe.desk) }
  // 탭이 막혔으면 한 일 뒤에 막혔다고 덧붙인다(세션은 생겼다). 탭으로 보여 줬으면 그렇게 말한다(tabReply).
  const shown = end.shown ? tabReply(data) : data
  return { ok, data: shown, text: end.blocked && ok ? `${msgOf(shown)} · ${T.popupBlocked}` : msgOf(shown), bad: !ok || end.blocked }
}
// 이 화면(브라우저 탭)의 이름: 서버가 클릭 순번을 브라우저마다 따로 견주게 한다(브라우저끼리는 시계가 달라 순번을 견줄 수 없다).
const CLIENT_ID = Math.random().toString(36).slice(2, 12)
async function openCard(id) {
  if (!can()) return denied()
  // 열 주소가 있으면 클릭 처리 안에서 바로 연다(await 뒤에 열면 브라우저가 팝업으로 막는다).
  const c = cardById(id), plan = clickPlan(c)
  const tab = plan.url ? openTab(c.desk, plan.url) : null
  toast(T.going)
  const seq = Date.now() * 1000 + (++clickN % 1000)
  // web = 이 클릭이 그 세션의 웹 터미널 탭을 실제로 열었는가(주소가 없었거나 브라우저가 탭을 막았으면 false). 서버는 이것으로
  // 창을 올리지 않은 클릭에서도 그 세션을 본 것으로 적을지 가린다 — 이 브라우저에만 저장한 주소로 연 탭은 서버가 알 길이 없다.
  const { ok, data } = await post('/api/open', { id, seq, client: CLIENT_ID, raise: plan.raise, web: Boolean(tab?.ok) })
  // 서버가 그 사이 읽기 전용이 됐다: 방금 새로 연 탭은 닫고, 이 화면도 다음 판을 기다리지 않고 읽기 전용으로 돌린다.
  if (data.code === 'read_only') { if (board) board.readonly = true; if (tab?.fresh) { try { tab.win.close() } catch {} openedTabs.delete(c.desk) } }
  if (data.code === 'superseded') return
  // 그 앱을 다시 켜 포트가 바뀌었다: 방금 연 탭을 서버가 알려 준 주소로 다시 보낸다(연 쪽이라 옮길 수 있다 — openTab 의 설명)
  const moved = tab?.ok && data.url ? portFixedUrl(plan.url, data.url) : ''
  if (moved) { try { tab.win.location.replace(moved) } catch {} }
  // 탭이 막혔으면 서버 쪽 성공 문구로 덮지 않는다. 그 세션을 탭으로 보여 줬으면 그렇게 말한다(shownReply)
  if (tab && !tab.ok) toast(T.popupBlocked, true); else toast(msgOf(data.url ? shownReply(data, Boolean(tab?.ok)) : data), !ok)
  refresh()
}
async function doAct(a, id) {
  if (!can()) return denied()
  const path = { seen: '/api/seen', unseen: '/api/unseen', pin: '/api/pin', unpin: '/api/pin', stash: '/api/stash', unstash: '/api/stash' }[a]
  if (!path) return
  busy = true
  try {
    const { ok, data } = await post(path, { id, on: !['unpin', 'unstash'].includes(a) })
    if (!ok) toast(msgOf(data), true)
  } finally { busy = false; refresh() }
}
async function resumeCard(id, sid) {
  if (!can()) return denied()
  toast(sid ? T.resuming : T.agentStarting)
  // 빈 세션은 판의 카드, 닫힌 세션은 최근 닫힘의 카드가 그 세션이다(되는 기능·데스크·주소 틀이 실려 있다)
  const c = cardById(id) || (board?.closed || []).find((x) => x.id === id) || null
  const r = await postWithTab('/api/resume', { id, sid }, c, sid ? T.resuming : T.agentStarting)
  toast(r.text, r.bad); refresh()
}

function hideFirstRun() { document.getElementById('firstrun').hidden = true; clearInterval(frTimer); frTimer = null; if (board) render(board) }
function showFirstRun(v, force) {
  const el = document.getElementById('firstrun')
  const plan = firstRunPlan(v, { readonly: !can(), force })
  if (!plan.show) return hideFirstRun()
  frForce = Boolean(force)
  const frRows = plan.rows ? choiceRows(v, T, { firstRun: true }) : []
  el.innerHTML = `<div class="frh"><span class="caps">${T[firstRunTitleKey(plan, frRows)]}</span><div class="seg mini frlang" role="group" aria-label="${esc(T.langLabel)}">${langSegHtml(lang)}</div><button class="x" data-firstrun-close aria-label="${esc(T.frClose)}">✕</button></div>
  ${envSummaryHtml(v, false, true)}
  ${plan.rows ? choiceRowsHtml(frRows, frPick) : ''}
  <div class="hint">${T[firstRunHintKey(plan, frRows)]}</div>
  ${plan.actions.includes('ok') ? `<button class="btn" data-firstrun-ok>${T.frOk}</button>` : `<button class="btn" data-firstrun-close>${T.frClose}</button>`}`
  el.hidden = false
  if (board) render(board)   // 안내가 떠 있는 동안에는 '다음에 할 일'을 말하지 않는다
  if (!frTimer && plan.rows && !force) { const id = setInterval(async () => {
    try {
      const n = await (await fetch('/api/autoconf', { cache: 'no-store' })).json()
      if (frTimer !== id) return   // 응답을 기다리는 사이에 안내가 닫혔다(X·Esc·이대로 시작): 늦게 온 답으로 다시 띄우지 않는다
      if (!n.first_run?.show) { acView = n; srvDefaults = n.client_defaults || srvDefaults; return hideFirstRun() }   // 다른 탭·터미널에서 이미 골랐다: 닫기 전에 그 값을 받는다
      if (JSON.stringify([n.summary, n.chosen]) === JSON.stringify([acView?.summary, acView?.chosen])) return
      acView = n; srvDefaults = n.client_defaults || srvDefaults; showFirstRun(n, false)
    } catch {}
  }, 5000); frTimer = id }
}
async function loadAutoconf() {

  if (e.key === 'Enter' && peekOn && e.target.closest?.('[data-browse],[data-folder]')) return
  if (e.key === 'Enter' && peekOn) { e.preventDefault(); if (!can()) return; return document.querySelector('[data-save-settings]') ? saveSettings() : createSession() }

  if (e.key === 'Enter' || e.key === ' ') {

    if (e.key === 'Enter' && board?.next) return openCard(board.next.id)

  if (/^[1-9]$/.test(e.key) && order[Number(e.key) - 1]) return openCard(order[Number(e.key) - 1].id)
})
// 서버 응답 code를 사용자 언어 문장으로 바꾼다(F11). 모르는 code·원문 오류는 뒤에 붙인다.
// 창을 올리는 조작의 성공 응답에 권한 경고(raise_warning)가 실려 오면 그 요약을 뒤에 붙인다 — 창을 다 올리지 못했는데 성공만 말하지 않는다(방법은 위의 안내 줄).
// 그 앱의 링크가 실패해 서버가 그 세션을 브라우저 탭으로 열었으면(opened 'browser') 그렇다고 덧붙인다.
const msgOf = (data) => { const base = msgBase(data), n = data?.ok ? raiseNotice(data.raise_warning, data.raise_warning_app, T) : null, l = data?.ok && data.opened === 'browser' ? T.linkTab(data.app) : ''; return [base, l, n ? n.summary : ''].filter(Boolean).join(' · ') }
const msgBase = (data) => { const f = data?.code && T.codes[data.code]; if (f) return typeof f === 'function' ? f(data) : f; return data?.message || data?.error || T.noReply }
// 알림 띠가 머무는 시간(F15). 보드가 화면에 보이지 않는 동안(세션을 눌러 앞으로 온 창이 보드를 다 가렸을 때 등)에는 내리지 않고, 다시 보인 뒤 이 시간만큼 더 보인다.
// 보드가 보이는 동안에는 포커스가 없어도(화면 나눠 쓰기) 이 시간 뒤에 내린다.
const TOAST_MS = 6000
function toast(msg, bad) {
  const el = document.getElementById('toast')
  el.textContent = msg; el.className = `toast on${bad ? ' err' : ''}`
  toast.off = () => { if (toastPlan({ hidden: document.visibilityState !== 'visible' }) === 'hold') { toast.held = true; return } el.className = 'toast' }
  toast.held = false; clearTimeout(toast.t); toast.t = setTimeout(toast.off, TOAST_MS)
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && toast.held) { toast.held = false; clearTimeout(toast.t); toast.t = setTimeout(toast.off, TOAST_MS) } })
addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(() => board && render(board), 150) })
refresh()
setInterval(refresh, 3000)
// 서버가 상태 변화를 알려 주면(SSE) 3초 주기를 기다리지 않고 바로 읽는다. 연결이 끊겨도 위의 3초 주기가 그대로 돈다.
if ('EventSource' in window) { const es = new EventSource('/api/events'); es.onmessage = () => refresh() }
// 누르기 직전 준비: 마우스가 판 위에서 움직이거나 창에 돌아오면 서버가 창 올리기에 쓸 목록을 미리 읽어 둔다(3초에 한 번).
let warmAt = 0
const warm = () => { if (Date.now() - warmAt < 3000 || !can()) return; warmAt = Date.now(); fetch('/api/warm', { cache: 'no-store' }).catch(() => {}) }
document.addEventListener('pointermove', warm, { passive: true }); addEventListener('focus', warm); document.addEventListener('keydown', warm)
// 탭으로 돌아오거나 네트워크가 돌아오면 3초를 기다리지 않고 바로 새로 읽는다.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh() })
addEventListener('focus', refresh)
addEventListener('online', refresh)
</script>
