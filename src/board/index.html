const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

// 경과 시간: [값, 단위]
function ago(iso, now) {
  if (!iso) return null
  const m = Math.max(0, Math.floor((now - new Date(iso)) / 60000))
  return m >= 1440 ? [Math.floor(m / 1440), T.day] : m >= 60 ? [Math.floor(m / 60), T.hour] : [m, T.min]
}
const tnum = (iso, now) => { const a = ago(iso, now); return a ? `${a[0]}<small>${a[1]}</small>` : '<small>—</small>' }

// 세션판 카드 → 띠 셀 상태
function stateOf(c, b) {
  if (b.columns.red.some((x) => x.id === c.id)) return c.failed ? 'fail' : 'wait'
  if (b.columns.yellow.some((x) => x.id === c.id)) return 'done'
  if ((b.columns.snoozed || []).some((x) => x.id === c.id)) return 'snooze'
  if (c.status === 'shell') return 'shell'
  if (c.status === 'working') return 'run'
  return 'idle'
}
const sinceOf = (c, st) => (st === 'wait' || st === 'fail' || st === 'done' || st === 'snooze') ? c.attention_since : (c.last_prompt_at || c.last_user_msg_at || c.attention_since)
const labelOf = (c) => c.label || c.project
// 긴 이름 줄이기: 이름·명령은 끝을 '…'로, 경로는 앞(~ 또는 첫 마디)과 끝 폴더를 남기고 가운데를 '…'로. 전체는 title로 보여 준다.
const clip = (s, n) => { const a = [...String(s ?? '')]; return a.length > n ? a.slice(0, n - 1).join('') + '…' : a.join('') }
const clipPath = (p, n = 40) => {
  p = String(p ?? ''); if ([...p].length <= n) return p
  const sep = p.includes('\\') && !p.includes('/') ? '\\' : '/', segs = p.split(sep).filter((x, i) => x || i === 0)
  let tail = segs.pop() || ''
  if ([...tail].length > n - 4) return '…' + sep + clip(tail, n - 2)
  while (segs.length > 1 && [...(segs[segs.length - 1] + sep + tail)].length <= n - 6) tail = segs.pop() + sep + tail
  return (segs[0] || '') + sep + '…' + sep + tail
}
const titleOf = (c) => (c.title === `${c.project} · ${c.provider}` ? c.project : c.title)
const nextSummary = (c, st) => { const s = summaryOf(c, st); return s === labelOf(c) || s === c.project ? (st === 'fail' ? T.failNoSay : st === 'done' ? T.done : c.ask_kind === 'approval' ? T.waiting : T.needsInput) : s }
const locQ = (q) => q && q.replace(/ — 승인할까요\?$/, ` — ${T.approveQ}`).replace(/^승인할까요\?$/, T.approveQ).replace(/^이 폴더를 신뢰할까요\? \(Yes, I trust this folder\)$/, T.trustQ)
const summaryOf = (c, st) => st === 'wait' || st === 'fail' || st === 'snooze' ? (locQ(c.question) || c.last_say || c.last_prompt || titleOf(c)) : st === 'done' ? (c.last_say || c.last_prompt || titleOf(c)) : st === 'shell' ? (c.recent_prompt ? T.recent(c.recent_prompt) : T.noAgent) : (c.last_prompt || titleOf(c))
const deskRank = (c) => c.ref.localeCompare

let board = null
let filter = null // 상단 숫자 칸으로 고른 상태(null = 전부)
let closedOpen = false
let order = []
let busy = false
let timer = null
const deskOrder = [] // 데스크 줄 순서(처음 본 순서로 고정, #4)

function allCards(b) {
  const seen = new Set()
  const out = []
  for (const k of ['red', 'yellow', 'snoozed', 'green', 'carry', 'grey']) for (const c of b.columns[k]) {
    // 서버를 끈 herdr 세션(off)의 칸은 판에 올리지 않는다. 기록은 DB에 남아 세션을 다시 켜면 그대로 돌아온다.
    if (c.kind === 'lane' || seen.has(c.id) || c.runtime !== 'herdr' || c.off) continue
    seen.add(c.id); out.push(c)
  }
  return out.sort((a, b2) => a.ref.localeCompare(b2.ref, 'en', { numeric: true }))
}

// 데스크 끄기는 누르는 즉시 화면에 반영한다(낙관 표시). herdr 서버가 실제로 내려가는 데 3초 넘게 걸릴 수 있어서다
// (실측: 에이전트 5개 데스크 3.17초). 서버가 꺼졌다고 알려 주거나 15초가 지나면 낙관 표시를 거둔다. 실패하면 바로 되돌린다.
const pendingOff = new Map()
function applyPendingOff(b) {
  const now = Date.now()
  for (const [desk, at] of pendingOff) if (now - at > 15000) pendingOff.delete(desk)
  if (!pendingOff.size) return b
  for (const k of ['red', 'yellow', 'snoozed', 'green', 'carry', 'grey']) for (const c of b.columns[k] || []) if (pendingOff.has(c.ref.split('/')[0])) c.off = true
  return b
}
// 칸이 있던 데스크 중 서버가 꺼진 것(원래 안 쓰는 default처럼 칸이 없던 세션은 빼고)
function offDesksOf(b) {
  const d = new Set()
  for (const k of ['red', 'yellow', 'snoozed', 'green', 'carry', 'grey']) for (const c of b.columns[k] || []) if (c.off) d.add(c.ref.split('/')[0])
  return [...d]
}

function sparkline(hourly) {
  if (!hourly || hourly.length < 2) return '<svg viewBox="0 0 400 54" preserveAspectRatio="none"></svg>'
  const max = Math.max(1, ...hourly)
  const pts = hourly.map((v, i) => `${(i / (hourly.length - 1)) * 400},${50 - (v / max) * 44}`).join(' ')
  return `<svg viewBox="0 0 400 54" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${pts}"/></svg>`
}

function render(b) {
  board = b
  const now = new Date(b.now).getTime()
  const cards = allCards(b)
  const states = new Map(cards.map((c) => [c.id, stateOf(c, b)]))
  const count = (st) => cards.filter((c) => states.get(c.id) === st).length
  // 순번은 서버가 정한 하나(b.order)를 그대로 쓴다 — 다음 1건·Enter·숫자키가 같다(약속 2). 옛 서버면 열 순서로 폴백.
  const byId = new Map(cards.map((c) => [c.id, c]))
  order = b.order ? b.order.map((id) => byId.get(id)).filter(Boolean) : [...b.columns.red, ...b.columns.yellow].filter((c) => c.runtime === 'herdr')
  const stale = cards.filter((c) => c.stale).length
  // 헤더 글자는 연결이 끊겼을 때만 보인다. 날짜·시각은 OS 시계, 세션 수는 아래 큰 숫자와 겹쳐서 뺐다. 수집 경과는 로고 툴팁.
  const el = document.getElementById('stamp'); const hl = b.health
  el.hidden = !hl?.stale && !b.raise_warning
  if (!hl?.stale && b.raise_warning) { el.title = T.raiseWarnTip; el.textContent = T.raiseWarn }
  if (hl?.stale) {
    // 끊긴 이유(#15)와 끊긴 지 얼마나 됐는지를 툴팁 밖에 보인다. 원문 오류는 툴팁.
    const ag = hl.ok_at ? ago(hl.ok_at, now) : null
    const since = ag && ag[0] > 0 ? ag.join('') : null // 1분 미만이면 '0분째'를 쓰지 않는다
    el.title = hl.error || ''
    el.textContent = [T.stale_collect(hl.ok_at ? new Date(hl.ok_at).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit', hour12: false }) : '—'), hl.error_kind && T.errKind[hl.error_kind], since && T.forN(since)].filter(Boolean).join(' · ')
  }
  document.getElementById('wordmark').title = hl && hl.age_sec !== null && hl.age_sec !== undefined ? T.collectedTip(hl.age_sec) : ''

  // 상단 띠: 전체 현황(상태별 큰 숫자) + 오늘 추이 + 다음 1건 한 줄
  const nx = b.next && b.next.runtime === 'herdr' ? b.next : null
  const nst = nx ? states.get(nx.id) : null
  const hero = document.getElementById('hero')
  const s = b.stats || {}
  const rate = s.within_3min_rate === null || s.within_3min_rate === undefined ? '—' : `${Math.round(s.within_3min_rate * 100)}%`
  const hours = (s.hourly || []).length
  const axis = hours > 1 ? [...new Set([0, .25, .5, .75, 1].map((f) => Math.round(f * (hours - 1))))].map((h) => `<span>${String(h).padStart(2, '0')}:00</span>`).join('') : ''
  const oldest = (st) => { const c = cards.filter((x) => states.get(x.id) === st).sort((p, q2) => (p.attention_since || '').localeCompare(q2.attention_since || ''))[0]; return c ? `${labelOf(c)} · ${(ago(c.attention_since, now) || ['', ''])[0]}${(ago(c.attention_since, now) || ['', ''])[1]}` : '' }
  const SUB = { wait: () => oldest('wait') || T.noWaitShort, fail: () => oldest('fail') || T.none, done: () => oldest('done') || T.none, run: () => cards.filter((c) => states.get(c.id) === 'run').map(labelOf).slice(0, 3).join(' · ') || T.none, idle: () => T.staleN(stale), all: () => [...new Set(cards.map((c) => c.desk))].map((d) => [d, cards.filter((c) => c.desk === d).length]).sort((x, y) => y[1] - x[1]).map(([d, n]) => `${d} ${n}`).join(' · ') }
  const statCell = (k, label, n) => `<div class="stat ${k}${n ? ' on' : ''}${filter === k ? ' sel' : ''}" data-filter="${k}" title="${filter === k ? esc(T.filterOn(label)) : ''}"><span class="caps">${label}</span><span class="n">${n}</span><span class="sub">${esc(SUB[k]())}</span></div>`
  hero.className = 'hero'
  const a = nx ? (ago(nx.attention_since, now) || [0, T.min]) : null
  hero.innerHTML = `<div class="stats">${statCell('wait', T.wait, count('wait'))}${statCell('fail', T.fail, count('fail'))}${statCell('done', T.done, count('done'))}${statCell('run', T.run, count('run'))}${statCell('idle', T.idle, count('idle'))}${statCell('all', T.panes, cards.length)}</div>
    <div class="r"><div class="lab caps"><span>${T.today}</span><i></i></div>
      <div class="kpi caps"><div class="hi">${T.raised}<span class="n">${s.raised ?? 0}<small>${T.cnt}</small></span></div><div>${T.within}<span class="n">${rate}</span></div></div>
      <div class="spark">${sparkline(s.hourly)}</div><div class="axis">${axis}</div></div>
    ${nx
      ? `<div class="nextline ${nst === 'fail' ? 'fail' : ''}" data-open="${nx.id}"><span class="caps"><i></i>${T.next}</span><span class="lb" title="${esc(labelOf(nx))}">${esc(clip(labelOf(nx), 24))}</span><span class="qq">${esc(nextSummary(nx, nst))} <span class="caps" style="text-transform:none">· ${[nx.desk, nx.branch].filter(Boolean).map((x) => esc(clip(x, 18))).join(' · ')}</span></span><span class="w">${a[0]}<small>${a[1]}</small> ${b.readonly ? '' : `<button class="chip ghost" data-seen="${nx.id}">${T.seen}</button>`}</span></div>`
      : `<div class="nextline quiet"><span class="caps"><i></i>${T.next}</span><span class="lb" style="color:var(--muted)">${T.quiet}</span><span class="qq">${b.health?.stale ? T.unknownWait : offDesksOf(b).length ? T.offDesks(offDesksOf(b).map(esc).join(', ')) + (b.readonly ? '' : ' ' + offDesksOf(b).map((d) => `<button class="deskbtn" data-desk-start="${esc(d)}">${T.deskOn} ${esc(d)}</button>`).join(' ')) : T.noWait}</span><span></span></div>`}`

  // 띠: 고정 줄 + 데스크별 칸 + 최근 닫힘
  const strip = document.getElementById('strip')
  const DESK_NAME = {}
  const groups = []
  // 핀 고정 칸은 정렬과 무관하게 맨 위 고정 줄에 둔다(고정한 순서대로).
  const pinned = cards.filter((c) => c.pinned_at).sort((x, y) => x.pinned_at.localeCompare(y.pinned_at))
  for (const c of cards) { if (c.pinned_at) continue; const g = groups.find((x) => x.desk === c.desk); g ? g.cards.push(c) : groups.push({ desk: c.desk, cards: [c] }) }
  // 칸이 많은 세션이 위로(사용자가 주로 보는 데스크), 같으면 이름순
  const ordered = orderDesks(groups, deskOrder); groups.length = 0; groups.push(...ordered)
  if (sortMode() === 'neglect') for (const g of groups) g.cards.sort((x, y) => neglectKey(x, states, now) - neglectKey(y, states, now))
  if (pinned.length) groups.unshift({ desk: T.pinnedDesk, cards: pinned, pinned: true })
  const matches = (st) => !filter || filter === 'all' || st === filter || (filter === 'idle' && (st === 'shell' || st === 'snooze'))
  const ro = b.readonly
  // 읽기 전용이면 머리의 '+ 새 세션'도 숨긴다(눌러도 403이지만 보이지 않는 편이 약속과 맞다).
  document.querySelector('[data-new]').hidden = Boolean(ro)
  const acts = (c, st) => ro ? '' : `<div class="acts">${['wait', 'fail', 'done'].includes(st) ? `<button data-act="seen" data-id="${c.id}">${T.seenBtn}</button>` : ''}${st === 'snooze' ? `<button data-act="unseen" data-id="${c.id}">${T.unseenBtn}</button>` : ''}<button data-act="${c.pinned_at ? 'unpin' : 'pin'}" data-id="${c.id}">${c.pinned_at ? T.unpinBtn : T.pinBtn}</button>${['idle', 'shell'].includes(st) ? `<button data-act="stash" data-id="${c.id}">${T.stashBtn}</button>` : ''}<button data-closepane="${c.id}" data-name="${esc(c.pane_label || c.project || c.ref)}">${T.closeBtn}</button></div>`
  const stLabel = (c, st) => st === 'snooze' ? T.snoozed(Math.max(1, Math.ceil((Date.parse(c.snoozed_until) - now) / 60000))) : ST[st]
  const before = flipFirst()
  const closed = b.closed || []
  const keep = b.settings?.closed_keep_days ?? 7
  strip.innerHTML = groups.map((g) => `<div class="desk caps${g.pinned ? ' pinned' : ''}"><em>${esc((g.desk || '').toUpperCase())}</em><span>${esc(DESK_NAME[g.desk] || '')}</span><span>${T.paneN(g.cards.length)}</span>${ro || g.pinned ? '' : `<button class="deskbtn" data-desk-stop="${esc(g.desk)}">${T.deskOff}</button>`}</div><div class="deskrow" style="--n:${Math.max(g.cards.length, 3)}">` +
    g.cards.map((c) => {
      const st = states.get(c.id)
      const idx = order.findIndex((o) => o.id === c.id)
      return `<div role="button" tabindex="0" class="cell ${st}${nx && c.id === nx.id ? ' next' : ''}${matches(st) ? '' : ' dim'}" data-next="${T.next}" data-open="${c.id}" title="${esc(c.title)} · ${esc(c.ref)}${c.branch ? ' · ' + esc(c.branch) : ''}${c.cwd ? ' · ' + esc(c.cwd) : ''}">${acts(c, st)}
        <div class="top"><span class="lb">${c.pinned_at ? '<span class="pinmark">◆</span>' : ''}<em>${esc(clip(labelOf(c), 20))}</em><span class="br">${esc(clip(c.branch || c.desk, 18))}</span>${c.fail_kind ? `<span class="tag" title="${esc(c.fail_kind)}">${esc(T.failKind[c.fail_kind] || c.fail_kind)}</span>` : ''}${c.unreachable ? `<span class="tag" title="${c.last_ok_at ? esc(T.lastOk(ago(c.last_ok_at, now).join(''))) : ''}">${T.unreach}${c.last_ok_at ? ` · ${ago(c.last_ok_at, now).join('')}` : ''}</span>` : ''}</span><span class="sx"><span class="st">${st === 'fail' ? '× ' : ''}${stLabel(c, st)}${idx >= 0 && idx < 9 ? ` ${idx + 1}` : ''}</span>${sinceOf(c, st) ? `<span class="t">${tnum(sinceOf(c, st), now)}</span>` : ''}</span></div>
        <div class="sum">${summaryOf(c, st) === labelOf(c) || summaryOf(c, st) === c.project ? `<span class="path">${esc(c.cwd ? clipPath(c.cwd.replace(/^\/Users\/[^/]+/, '~'), 40) : T.noPrompt)}</span>` : esc(summaryOf(c, st))}</div>
        ${st === 'shell' && !ro ? `<button class="resume" data-resume="${c.id}" data-sid="${esc(c.resume?.sid || '')}" title="${esc(c.resume ? T.resumeWhat(c.resume.prompt, (ago(c.resume.at, now) || []).join('')) : T.resumeFresh)}">${T.resume}</button>` : c.stale && !(nx && c.id === nx.id) ? `<span class="stale">${T.stale}</span>` : ''}</div>`
    }).join('') + '</div>').join('') +
    (closed.length ? `<details class="closedrow"${closedOpen ? ' open' : ''}><summary class="caps"><em>${T.closedTitle}</em><span>${closed.length}</span><span>${T.closedHint(keep)}</span></summary><div class="closed">${closed.map((c) => `<div class="c"><span class="lb" title="${esc(c.pane_label || c.project)}">${esc(clip(c.pane_label || c.project, 28))}</span><span class="why">${esc(c.desk)} · ${c.reason === 'stashed' ? T.stashedWhy : T.gone} · ${(ago(c.closed_at, now) || ['', ''])[0]}${(ago(c.closed_at, now) || ['', ''])[1]}</span>${ro ? '' : c.reason === 'stashed' ? `<button data-act="unstash" data-id="${c.id}">${T.unstashBtn}</button>` : `<button data-resume="${c.id}" data-sid="${esc(c.resume?.sid || '')}" title="${esc(c.resume ? T.resumeWhat(c.resume.prompt, (ago(c.resume.at, now) || []).join('')) : T.resumeFresh)}">${T.reopen}</button>`}</div>`).join('')}</div></details>` : '')
  fitHeight()
  flipPlay(before)
  signal(cards, states)
}

// 칸이 보드 아래로 넘쳐 스크롤이 생기면 히어로를 줄이고, 그래도 넘치면 카드 높이를 남은 높이에 맞춘다. 좁은 화면(760px 이하)은 목록형이라 건드리지 않는다.
function fitHeight() {
  const root = document.documentElement, strip = document.getElementById('strip')
  root.classList.remove('fit1', 'fit2', 'tight'); root.style.removeProperty('--fit-h')
  if (innerWidth <= 760 || strip.scrollHeight <= strip.clientHeight + 1) return
  root.classList.add('fit1')
  if (strip.scrollHeight <= strip.clientHeight + 1) return
  const cells = [...strip.querySelectorAll('.cell')]
  if (!cells.length) return
  const rows = new Set(cells.map((c) => c.offsetTop)).size
  const cellsH = [...new Set(cells.map((c) => c.offsetTop))].reduce((sum, top) => sum + Math.max(...cells.filter((c) => c.offsetTop === top).map((c) => c.offsetHeight)), 0)
  const other = strip.scrollHeight - cellsH
  const h = Math.floor((strip.clientHeight - other) / rows) - 1
  root.style.setProperty('--fit-h', Math.max(h, 76) + 'px')
  root.classList.add('fit2')
  if (h < 112) root.classList.add('tight')
}

/* 방치순 정렬 + FLIP 모션 */
function sortMode() { return localStorage.getItem('whosup-sort') === 'neglect' ? 'neglect' : 'desk' }

  if (ATTN.includes(st)) { const i = order.findIndex((o) => o.id === c.id); return i < 0 ? 1e14 : i }
  const t = Date.parse(sinceOf(c, st) || '') || now

function flipFirst() { const m = new Map(); document.querySelectorAll('.cell[data-open]').forEach((el) => m.set(el.dataset.open, el.getBoundingClientRect())); return m }
function flipPlay(first) {
  if (!first.size || matchMedia('(prefers-reduced-motion: reduce)').matches) return
  document.querySelectorAll('.cell[data-open]').forEach((el) => {
    const a = first.get(el.dataset.open); if (!a) return
    const b2 = el.getBoundingClientRect(); const dx = a.left - b2.left, dy = a.top - b2.top
    if (!dx && !dy) return
    el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' })
  })
}

function attnKey(c) { return `${c.status}:${c.attention_since || ''}` }
// prev: 직전 관측 Map(id→키, null이면 첫 관측), attn: 지금 관측, alerts: id→{n 보낸 횟수, at, key}.
// 돌려주는 값: send [{id, again}], drop(풀린 칸 id), 새 alerts.
function planAlerts(prev, attn, alerts, { now, away, on, off, cfg }) {
  const send = [], drop = [], next = new Map()

  for (const [id, key] of attn) {
    const rec = alerts.get(id)
    if (!prev) { next.set(id, { n: 0, at: now, key }); continue }
    if (prev.get(id) !== key || !rec || rec.key !== key) {
      if (can) send.push({ id, again: false })
      next.set(id, { n: can ? 1 : 0, at: now, key, fresh: true })
    } else if (can && rec.n <= cfg.renotify_max && now - rec.at >= cfg.renotify_min * 60000) {
      // 오래 방치된 손 든 칸은 다시 알린다(약속 4). "다시"는 실제로 한 번 보낸 뒤에만(#21).
      send.push({ id, again: rec.n > 0 })
      next.set(id, { n: rec.n + 1, at: now, key })

  for (const id of alerts.keys()) if (!attn.has(id)) drop.push(id)

// 감시가 끊긴 것도 알린다(I-7). key: 끊김 에피소드(null이면 연결됨). 잠에서 깬 직후 한 번 늦은 응답으로는 울리지 않게
// 연속 2회 관측이나 수집 오류가 함께 있을 때만, 에피소드당 한 번.
function planBlind(b, key, { errored }) {

  const same = b.key === key

// 데스크 줄 순서는 처음 본 순서로 고정한다(#4). 처음 한꺼번에 보인 데스크는 칸 많은 순·이름순, 그 뒤 새 데스크는 끝에.
function orderDesks(groups, seen) {
  const fresh = groups.filter((g) => !seen.includes(g.desk)).sort((a, b) => b.cards.length - a.cards.length || a.desk.localeCompare(b.desk))
  for (const g of fresh) seen.push(g.desk)

let alerts = new Map()
const openNt = new Map() // id → 열린 Notification
let blind = {}
let blindNt = null
function sendAlert(c, st, again) {
  const nt = new Notification(`${labelOf(c)} · ${ST[st]}${again ? ` · ${T.again}` : ''}`, { body: nextSummary(c, st), tag: `whosup-${c.id}`, icon: FAV(true), renotify: Boolean(again) })
  nt.onclick = () => { window.focus(); if (can()) openCard(c.id); nt.close() }

}
function setChrome(n, off) {
  document.title = off ? '(!) whosup' : n ? `(${n}) whosup` : 'whosup'
  const fav = document.getElementById('fav'); const mode = off ? 'off' : String(n > 0)
  if (fav.dataset.lit !== mode) { fav.href = FAV(off ? 'off' : n > 0); fav.dataset.lit = mode }
}
const isAway = () => document.visibilityState !== 'visible' || !document.hasFocus()
// 끊김 알림: herdr를 못 읽거나(key herdr:<마지막 성공 시각>) 후즈업 서버가 답하지 않을 때(key server).

  if (blind.close) { blindNt?.close(); blindNt = null }
  if (blind.due && notifyOn() && isAway()) {
    blindNt = new Notification(key === 'server' ? T.blindServer : T.blindHerdr, { body: T.blindBody, tag: 'whosup-blind', icon: FAV('off') })
    blind.sent = true

function signal(cards, states) {
  const raisedCards = cards.filter((c) => ATTN.includes(states.get(c.id)))
  const attn = new Map(raisedCards.map((c) => [c.id, attnKey(c)]))
  const hl = board?.health
  const off = Boolean(hl?.stale)
  setChrome(attn.size, off)
  blindSignal(off ? `herdr:${hl?.ok_at || ''}` : null, Boolean(hl?.error))
  const cfg = board?.settings || { renotify_min: 15, renotify_max: 4 }
  const r = planAlerts(prevAttn, attn, alerts, { now: Date.now(), away: isAway(), on: notifyOn(), off, cfg })
  for (const [id, rec] of r.alerts) if (rec.fresh) { pinged.set(id, Date.now()); delete rec.fresh }
  for (const { id, again } of r.send) {
    const c = raisedCards.find((x) => x.id === id)
    openNt.get(id)?.close()
    openNt.set(id, sendAlert(c, states.get(id), again))
  }
  // 손 든 상태가 풀린 칸의 알림은 걷어 낸다(F13).
  for (const id of r.drop) { openNt.get(id)?.close(); openNt.delete(id) }
  alerts = r.alerts
  prevAttn = attn
  for (const [id, t] of pinged) if (Date.now() - t > 1600) pinged.delete(id)

}
async function setNotify(v) {
  if (v === 'on' && 'Notification' in window) {
    const p = Notification.permission === 'default' ? await Notification.requestPermission() : Notification.permission
    if (p !== 'granted') { localStorage.setItem('whosup-notify', 'off'); applyChrome(); return toast(T.nDenied, true) }
    localStorage.setItem('whosup-notify', 'on'); applyChrome(); toast(T.nOnToast)
    return new Notification(T.nTest, { tag: 'whosup-test', icon: FAV(true) })
  }
  localStorage.setItem('whosup-notify', 'off'); applyChrome()
}

// 새로고침은 한 번에 하나만(#11). busy는 POST 동작 중에만 참이라 진행 중인 GET과 새 GET이 겹칠 수 있었다.
let refreshing = false
let pageBuild = null
async function refresh() {
  if (busy || refreshing) return
  refreshing = true
  try {
    const p = new URLSearchParams()
    if (q.get('all') === '1') p.set('all', '1')
    if (document.visibilityState === 'visible') p.set('view', '1')
    // 서버가 멈추면 fetch가 끝나지 않는다 — 8초에 끊고 끊김으로 표시한다.
    const r = await fetch(`/api/board${p.size ? `?${p}` : ''}`, { cache: 'no-store', signal: AbortSignal.timeout(8000) })
    if (!r.ok) throw new Error(`HTTP ${r.status}`)
    const data = await r.json()
    if (data.build && pageBuild && data.build !== pageBuild && !document.querySelector('.peek.on')) return location.reload()
    pageBuild = data.build || pageBuild
    render(applyPendingOff(data))
    document.getElementById('err').hidden = true
  } catch (e) {
    const el = document.getElementById('err'); el.textContent = T.connErr(e.message); el.hidden = false
    const st = document.getElementById('stamp'); st.hidden = false; st.textContent = T.off
    setChrome(0, true)
    blindSignal('server', false)
  } finally { refreshing = false }
}
const post = async (path, body) => {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
  const data = await r.json().catch(() => ({ message: `HTTP ${r.status}` }))
  return { ok: r.ok, data }
}
// 읽기 전용 게이트는 하나(I-10). 화면의 모든 동작(칸 클릭·Enter·숫자키·알림 클릭·버튼)은 아래 함수들을 거치고, 함수마다 이것부터 본다.
const can = () => !board?.readonly
// 클릭 순번: 서버가 도착 순서가 아니라 클릭 순서로 마지막 클릭을 고르게 한다(터널·네트워크에서 순서가 바뀜)
let clickN = 0
async function openCard(id) {
  if (!can()) return toast(T.codes.read_only, true)
  toast(T.going)
  const seq = Date.now() * 1000 + (++clickN % 1000)
  const { ok, data } = await post('/api/open', { id, seq })
  if (data.code === 'superseded') return
  toast(msgOf(data), !ok)
  refresh()
}
async function doAct(a, id) {
  if (!can()) return toast(T.codes.read_only, true)
  const path = { seen: '/api/seen', unseen: '/api/unseen', pin: '/api/pin', unpin: '/api/pin', stash: '/api/stash', unstash: '/api/stash' }[a]
  if (!path) return
  busy = true
  try {
    const { ok, data } = await post(path, { id, on: !['unpin', 'unstash'].includes(a) })
    if (!ok) toast(msgOf(data), true)
  } finally { busy = false; refresh() }
}

  if (!can()) return toast(T.codes.read_only, true)
  toast(T.resuming)
  const { ok, data } = await post('/api/resume', { id, sid })

}

  if (t.closest('[data-close]')) return closePeek()
  const seen = t.closest('[data-seen]')
  if (seen) { e.stopPropagation(); return doAct('seen', Number(seen.dataset.seen)) }
  const rs = t.closest('[data-resume]')
  if (rs) { e.stopPropagation(); return resumeCard(Number(rs.dataset.resume), rs.dataset.sid || null) }
  const lg = t.closest('[data-lang]')
  if (lg) { lang = okLang(lg.dataset.lang) || lang; localStorage.setItem('whosup-lang', lang); applyChrome(); if (board) render(board); return document.querySelector('.peek.on [data-lang]') && showSettings() }
  const fl = t.closest('[data-filter]')
  if (fl) { const k = fl.dataset.filter; filter = filter === k || k === 'all' ? null : k; return board && render(board) }
  const cpn = t.closest('[data-closepane]')
  if (cpn) { e.stopPropagation(); if (!confirm(T.closeConfirm(cpn.dataset.name))) return; return post('/api/close', { id: Number(cpn.dataset.closepane) }).then(({ ok, data }) => { toast(msgOf(data), !ok); refresh() }) }
  const ds = t.closest('[data-desk-stop]')
  if (ds) {
    e.stopPropagation(); const desk = ds.dataset.deskStop
    if (!confirm(T.deskOffConfirm(desk))) return
    pendingOff.set(desk, Date.now()); if (board) render(applyPendingOff(board))
    return post('/api/desk', { session: desk, on: false }).then(({ ok, data }) => { if (!ok) pendingOff.delete(desk); toast(msgOf(data), !ok); refresh() })
  }
  const dn = t.closest('[data-desk-start]')
  if (dn) { e.stopPropagation(); pendingOff.delete(dn.dataset.deskStart); toast(T.opening); return post('/api/desk', { session: dn.dataset.deskStart, on: true }).then(({ ok, data }) => { toast(msgOf(data), !ok); refresh() }) }
  const act = t.closest('[data-act]')
  if (act) { e.stopPropagation(); return doAct(act.dataset.act, Number(act.dataset.id)) }
  if (t.closest('[data-sort-toggle]')) { const m = sortMode() === 'neglect' ? 'desk' : 'neglect'; localStorage.setItem('whosup-sort', m); applyChrome(); if (board) render(board); return toast(m === 'neglect' ? T.sortedToast : T.sortedDeskToast) }
  if (t.closest('[data-notify-toggle]')) return setNotify(notifyOn() ? 'off' : 'on')
  if (t.closest('[data-theme-cycle]')) { const m = NEXT_THEME[themeMode()]; localStorage.setItem('whosup-theme', m); applyChrome(); return toast(T.themeToast({ system: T.thAuto, light: T.thLight, dark: T.thDark }[m])) }
  if (t.closest('[data-new]')) return showNew()
  if (t.closest('[data-settings]')) return showSettings()
  if (t.closest('[data-save-settings]')) return saveSettings()
  const folder = t.closest('[data-folder]')
  if (folder) { newState.cwd = folder.dataset.folder; await browseTo(newState.cwd); return renderNew() }
  const br = t.closest('[data-browse]')
  if (br) { await browseTo(br.dataset.browse); return renderNew() }
  const cp = t.closest('[data-cmd-preset]')
  if (cp) { const el = document.getElementById('set-agent_cmd'); el.value = cp.dataset.cmdPreset; document.querySelectorAll('[data-cmd-preset]').forEach((b) => b.classList.toggle('on', b === cp)); return }
  const target = t.closest('[data-target]')
  if (target) { newState.session = target.dataset.target; return renderNew() }
    if (t.closest('[data-create]')) return createSession()
  const open = t.closest('[data-open]')
  if (open) return openCard(Number(open.dataset.open))
})
document.addEventListener('toggle', (e) => {
  if (e.target.classList?.contains('closedrow')) closedOpen = e.target.open
}, true)
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const typing = e.target.closest?.('input,textarea')
  if (e.key === 'Escape') return closePeek()
  if (e.key === 'Enter') {
    if (peekOn) { e.preventDefault(); if (!can()) return; return document.querySelector('[data-save-settings]') ? saveSettings() : createSession() }
    if (board?.next) return openCard(board.next.id)
  }
  if (typing) return
  if (e.key === 'n' || e.key === 'N' || e.key === 'ㅜ') { e.preventDefault(); return showNew() }
  if (/^[1-9]$/.test(e.key) && order[Number(e.key) - 1]) return openCard(order[Number(e.key) - 1].id)
})
// 서버 응답 code를 사용자 언어 문장으로 바꾼다(F11). 모르는 code·원문 오류는 뒤에 붙인다.
const msgOf = (data) => { const f = data?.code && T.codes[data.code]; if (f) return typeof f === 'function' ? f(data) : f; return data?.message || data?.error || T.noReply }
function toast(msg, bad) {
  const el = document.getElementById('toast')
  el.textContent = msg; el.className = `toast on${bad ? ' err' : ''}`
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.className = 'toast' }, 4500)
}
addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(() => board && render(board), 150) })
refresh()
setInterval(refresh, 3000)
// 탭으로 돌아오거나 네트워크가 돌아오면 3초를 기다리지 않고 바로 새로 읽는다.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh() })
addEventListener('focus', refresh)
addEventListener('online', refresh)
</script>
